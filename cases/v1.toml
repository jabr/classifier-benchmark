# System One benchmark test cases — suite v1.
# Locked: this file is final; `just validate` verifies its content hash. Do not edit.
# Schema: bench/cases.py. Hashes: cases/hashes.json.

[[task]]
id = "support_department"
type = "choice"

[task.question]
instructions = "Which team should handle this support message?"

[task.question.criteria]
billing = "Refunds, payments, invoices, subscriptions, or unexpected charges"
tech = "Bugs, errors, crashes, downtime, or integration failures"
sales = "Pricing questions, quotes, upgrades, demos, or new purchases"
account = "Login issues, password resets, profile changes, or data deletion requests"
other = "Anything that does not match the other categories"

[[task.cases]]
state = "I was charged twice on my card this month for the same subscription, how do I get that fixed?"
expected = "billing"

[[task.cases]]
state = "The iOS app crashes immediately every time I try to open a report."
expected = "tech"

[[task.cases]]
state = "Do you offer a discount if we buy 50 seats for our team?"
expected = "sales"

[[task.cases]]
state = "I forgot my password and the reset email never arrives."
expected = "account"

[[task.cases]]
state = "I want to cancel my annual plan and get a refund for the unused months."
expected = "billing"

[[task.cases]]
state = "The API returns a 500 error whenever we upload files larger than 10MB."
expected = "tech"

[[task.cases]]
state = "Can I book a demo of the enterprise features for next Tuesday?"
expected = "sales"

[[task.cases]]
state = "The invoice PDF shows the wrong VAT number on line 3."
expected = "billing"

[[task.cases]]
state = "How do I change the email address associated with my account?"
expected = "account"

[[task.cases]]
state = "I just want to say the new dashboard looks amazing."
expected = "other"

[[task.cases]]
state = "What does the Pro plan cost per seat per month?"
expected = "sales"

[[task.cases]]
state = "Our SSO integration with Okta started returning empty profiles this morning after your release."
expected = "tech"

[[task.cases]]
state = "We need a formal quote including on-prem hosting for a 3-year term."
expected = "sales"

[[task.cases]]
state = "Please permanently delete all of my personal data under GDPR."
expected = "account"

[[task.cases]]
state = "Where is your office located? Asking because my company ships hardware nearby."
expected = "other"

[[task]]
id = "email_intent"
type = "choice"

[task.question]
instructions = "What is the main intent of this email?"

[task.question.criteria]
meeting_request = "They want to schedule a meeting or call"
question = "They are asking a question that needs an answer"
complaint = "They are complaining about a problem or expressing dissatisfaction"
thanks = "They are expressing gratitude or appreciation"
fyi = "They are just sharing information without asking for anything"

[[task.cases]]
state = "Can we grab 30 minutes on Thursday to go over the migration plan?"
expected = "meeting_request"

[[task.cases]]
state = "Quick one: is the invoice due on the 1st or the 15th?"
expected = "question"

[[task.cases]]
state = "This is the second time the booking widget broke right before a demo. Not happy at all."
expected = "complaint"

[[task.cases]]
state = "Huge thanks to the whole team for turning that fix around so fast last night!"
expected = "thanks"

[[task.cases]]
state = "Heads up: the staging cluster will be offline this weekend for scheduled maintenance."
expected = "fyi"

[[task.cases]]
state = "Let's sync Monday morning to review the roadmap; I will send an invite."
expected = "meeting_request"

[[task.cases]]
state = "When do you expect the beta invites to go out?"
expected = "question"

[[task.cases]]
state = "I have been waiting three weeks for an update on ticket 4402 and honestly this is starting to feel ignored."
expected = "complaint"

[[task.cases]]
state = "Thank you for the thoughtful onboarding call, it really helped our team get started."
expected = "thanks"

[[task.cases]]
state = "For your information, we finished the data migration test run and everything passed without issues."
expected = "fyi"

